id = "herdr-simple-git"
name = "Herdr Simple Git"
version = "0.5.6"
min_herdr_version = "0.9.0"
description = "Pull, commit, and push one repository without AI"
platforms = ["windows", "linux", "macos"]

[[startup]]
platforms = ["linux", "macos"]
command = ["python3", "-X", "utf8", "src/dock.py", "start"]

[[startup]]
platforms = ["windows"]
command = ["python", "-X", "utf8", "src/dock.py", "start"]

[[actions]]
id = "update"
title = "Git update (pull) (--ff-only)"
contexts = ["workspace"]
command = ["python", "-X", "utf8", "src/index.py", "update"]

[[actions]]
id = "commit"
title = "Git commit all changes"
contexts = ["workspace"]
command = ["python", "-X", "utf8", "src/index.py", "commit"]

[[actions]]
id = "push"
title = "Git push"
contexts = ["workspace"]
command = ["python", "-X", "utf8", "src/index.py", "push"]

[[actions]]
id = "all"
title = "Git update (pull), commit, push"
contexts = ["workspace"]
command = ["python", "-X", "utf8", "src/index.py", "all"]

# Dock agent: one "N repos" entry in the herdr-dock workspace. Python 3 standard library only.
[[actions]]
id = "dock-start"
title = "Git repos: show dock agent"
platforms = ["linux", "macos"]
contexts = ["global"]
command = ["python3", "-X", "utf8", "src/dock.py", "start"]

[[actions]]
id = "dock-stop"
title = "Git repos: hide dock agent"
platforms = ["linux", "macos"]
contexts = ["global"]
command = ["python3", "-X", "utf8", "src/dock.py", "stop"]

[[actions]]
id = "dock-start-windows"
title = "Git repos: show dock agent"
platforms = ["windows"]
contexts = ["global"]
command = ["python", "-X", "utf8", "src/dock.py", "start"]

[[actions]]
id = "dock-stop-windows"
title = "Git repos: hide dock agent"
platforms = ["windows"]
contexts = ["global"]
command = ["python", "-X", "utf8", "src/dock.py", "stop"]
